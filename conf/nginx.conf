# https://www.nginx.com/resources/wiki/start/topics/recipes/drupal/

error_log /proc/self/fd/2;
pid /tmp/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 100000;

events {
  multi_accept on;
  worker_connections 8192;
}

http {
  access_log /proc/self/fd/1;

  # --- OpenShift/Kubernetes temp paths ---
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  client_max_body_size 20m;
  default_type application/octet-stream;
  fastcgi_buffers 8 16k;
  fastcgi_buffer_size 32k;

  gzip on;
  gzip_buffers 16 8k;
  gzip_comp_level 4;
  gzip_disable msie6;
  gzip_proxied off;
  gzip_types application/json;
  gzip_vary on;

  include /etc/nginx/mime.types;
  index index.html index.htm;
  keepalive_timeout 120;

  # --- cache moved to writable location ---
  proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=one:8m max_size=3000m inactive=600m;

  sendfile on;
  server_tokens off;
  tcp_nopush on;
  types_hash_max_size 2048;

  server {
      listen 80;
      listen [::]:80;

      root /var/www/html;
      index index.php index.html index.htm;

      server_name drupal.dev;

      location = /favicon.ico {
          log_not_found off;
          access_log off;
      }

      location = /robots.txt {
          allow all;
          log_not_found off;
          access_log off;
      }

      location ~ \..*/.*\.php$ {
          return 403;
      }

      location ~ ^/sites/.*/private/ {
          return 403;
      }

      location ~ ^/sites/[^/]+/files/.*\.php$ {
          deny all;
      }

      location ~* ^/.well-known/ {
          allow all;
      }

      location ~ (^|/)\. {
          return 403;
      }

      location / {
          try_files $uri $uri/ /index.html /index.php?$query_string;
      }

      location @rewrite {
          rewrite ^ /index.php;
      }

      location ~ /vendor/.*\.php$ {
          deny all;
          return 404;
      }

      location ~* \.(engine|ht|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|/(\.(?!well-known).*)|composer\.(json|lock)|web\.config$|/#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
          deny all;
          return 404;
      }

      location ~ '\.php$|^/update.php' {
        proxy_intercept_errors on;
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;

        fastcgi_pass web:9000;
      }

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
          try_files $uri @rewrite;
          expires max;
          log_not_found off;
      }

      location ~ ^/sites/.*/files/styles/ {
          try_files $uri @rewrite;
      }

      location ~ ^(/[a-z\-]+)?/system/files/ {
          try_files $uri /index.php?$query_string;
      }

      if ($request_uri ~* "^(.*/)index\.php/(.*)") {
          return 307 $1$2;
      }
  }
}
